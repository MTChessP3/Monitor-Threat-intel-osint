name: Deploy to Vercel (Takedown)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Deploy to Vercel (Takedown)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN_TAKEDOWN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID_TAKEDOWN }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_TAKEDOWN }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_TAKEDOWN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_TAKEDOWN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TAKEDOWN }}
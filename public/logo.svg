<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 32 32" xml:space="preserve">
<defs>
  <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0f172a"/>
    <stop offset="100%" style="stop-color:#1e293b"/>
  </linearGradient>
  <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#10b981"/>
    <stop offset="100%" style="stop-color:#059669"/>
  </linearGradient>
  <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#34d399"/>
    <stop offset="100%" style="stop-color:#10b981"/>
  </linearGradient>
</defs>

<!-- Shield body -->
<path d="M16 2 L28 8 L28 16 C28 23 22 28.5 16 30 C10 28.5 4 23 4 16 L4 8 Z" 
      fill="url(#shieldGrad)" stroke="#10b981" stroke-width="1.2"/>

<!-- Inner shield highlight -->
<path d="M16 4.5 L26 9.5 L26 16 C26 21.8 21 26.5 16 28 C11 26.5 6 21.8 6 16 L6 9.5 Z" 
      fill="none" stroke="#10b98140" stroke-width="0.5"/>

<!-- Eye/radar symbol - outer arc -->
<path d="M8 16 C8 11.6 11.6 8 16 8 C20.4 8 24 11.6 24 16" 
      fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" stroke-linecap="round"/>

<!-- Eye/radar symbol - inner arc -->
<path d="M11 16 C11 13.2 13.2 11 16 11 C18.8 11 21 13.2 21 16" 
      fill="none" stroke="url(#eyeGrad)" stroke-width="1.2" stroke-linecap="round"/>

<!-- Center dot (pupil/radar point) -->
<circle cx="16" cy="16" r="2" fill="url(#emeraldGrad)"/>

<!-- Radar pulse lines -->
<line x1="16" y1="16" x2="22" y2="10" stroke="#34d39980" stroke-width="0.6" stroke-linecap="round"/>
<line x1="16" y1="16" x2="10" y2="11" stroke="#34d39960" stroke-width="0.4" stroke-linecap="round"/>
<line x1="16" y1="16" x2="20" y2="22" stroke="#34d39940" stroke-width="0.3" stroke-linecap="round"/>

<!-- Scan line animation -->
<style>
  @keyframes scan {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  .pulse { animation: scan 2.5s ease-in-out infinite; }
</style>
<circle class="pulse" cx="16" cy="16" r="6" fill="none" stroke="#34d399" stroke-width="0.4"/>
</svg>
